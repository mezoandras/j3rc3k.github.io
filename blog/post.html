<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starter</title>
<meta name="description" content="Starter – a minimalist personal blog.">
<script>
  // téma beállítása a megjelenés előtt (nincs villanás)
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <a class="logo" href="index.html">Starter</a>
    <nav class="nav">
      <a href="#">About</a>
      <a href="index.html#posts">Blog</a>
      <a href="index.html#posts">Tags</a>
      <button class="theme-toggle" type="button" aria-label="Téma váltása">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </header>

  <main>
    <article class="post narrow" id="post"><p class="status">Betöltés…</p></article>
  </main>

  <footer class="site-footer">
    <div class="footer-top">
      <div>
        <h4>Starter</h4>
        <p>This theme is designed by <a href="#">nrk9819</a>. You can download the figma file for from <a href="#">dribbble</a>.</p>
      </div>

        <li><a href="#">Mastodon</a></li>
        <li><a href="#">Dribbble</a></li>
        <li><a href="#">Github</a></li>
      </ul>
    </div>
    <div class="footer-bottom">
      <span>© <span class="year">2024</span> nrk9819</span>
      <nav><a href="#">Privacy Policy</a><a href="#">Terms and Conditions</a></nav>
    </div>
  </footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
